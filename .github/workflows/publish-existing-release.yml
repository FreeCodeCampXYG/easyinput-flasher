name: Publish Existing Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish
        required: true
        type: string
      source_run_id:
        description: Completed Release workflow run containing package artifacts
        required: true
        type: string
      retry_run_id:
        description: Optional Retry Platform Build run for one missing platform
        required: false
        type: string
      retry_artifact:
        description: Optional missing artifact name, for example easyinput-flasher-linux-x64
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download existing package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id }}
          RETRY_ARTIFACT: ${{ inputs.retry_artifact }}
        run: |
          rm -rf dist
          mkdir -p dist
          for artifact in easyinput-flasher-windows-x64 easyinput-flasher-windows-arm64 easyinput-flasher-macos-intel easyinput-flasher-macos-arm64 easyinput-flasher-linux-x64 easyinput-flasher-linux-arm64; do
            gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "dist/$artifact" || true
          done
          if [ -n "$RETRY_RUN_ID" ] || [ -n "$RETRY_ARTIFACT" ]; then
            test -n "$RETRY_RUN_ID" && test -n "$RETRY_ARTIFACT"
            gh run download "$RETRY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$RETRY_ARTIFACT" --dir "dist/$RETRY_ARTIFACT"
          fi
      - name: Verify package files
        shell: bash
        run: |
          rm -rf publish
          mkdir -p publish
          for artifact in easyinput-flasher-windows-x64 easyinput-flasher-windows-arm64 easyinput-flasher-macos-intel easyinput-flasher-macos-arm64 easyinput-flasher-linux-x64 easyinput-flasher-linux-arm64; do
            test -d "dist/$artifact"
          done
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -print0 |
            while IFS= read -r -d '' file; do
              base="$(basename "$file")"
              case "$file" in
                *easyinput-flasher-windows-arm64*/*windows-x64-portable.zip) base="${base/windows-x64/windows-arm64}" ;;
                *easyinput-flasher-windows-arm64*/*windows-x64-portable.zip.sha256) base="${base/windows-x64/windows-arm64}" ;;
              esac
              if [ ! -e "publish/$base" ]; then cp "$file" "publish/$base"; fi
            done
          test -n "$(find publish -type f -name '*.sha256' -print -quit)"
          find publish -type f -print
      - name: Publish GitHub Release from existing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" publish/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" publish/* --title "EasyInput Flasher ${RELEASE_TAG}" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" publish/* --title "EasyInput Flasher ${RELEASE_TAG}" --generate-notes
          fi
