name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Development package version without v prefix
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-2025, platform: windows/amd64, artifact: windows-x64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require license and notices
        shell: bash
        run: test -f LICENSE && test -f THIRD_PARTY_NOTICES.md
      - name: Install and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
      - name: Test Go
        run: |
          go test ./...
          go vet ./...
      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          wails build -clean -trimpath -platform "${{ matrix.platform }}" -ldflags "-X main.version=$version"
          $architecture = if ('${{ matrix.platform }}' -eq 'windows/arm64') { 'arm64' } else { 'x64' }
          ./scripts/package-windows.ps1 -Version $version -Architecture $architecture
      - uses: actions/upload-artifact@v4
        with:
          name: easyinput-flasher-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Attest packaged assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download package artifacts by platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist publish
          mkdir -p dist publish
          for artifact in easyinput-flasher-windows-x64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "dist/$artifact"
          done
      - name: Prepare unique release assets
        shell: bash
        run: |
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -print0 |
            while IFS= read -r -d '' file; do
              base="$(basename "$file")"
              cp "$file" "publish/$base"
            done
          test -n "$(find publish -type f -name '*.sha256' -print -quit)"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" publish/* --title "EasyInput Flasher ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" publish/* --title "EasyInput Flasher ${GITHUB_REF_NAME}" --generate-notes
          fi
