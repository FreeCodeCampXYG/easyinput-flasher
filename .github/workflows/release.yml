name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Development package version without v prefix
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-2025, platform: windows/amd64, artifact: windows-x64 }
          - { name: Windows ARM64, runner: windows-11-arm, platform: windows/arm64, artifact: windows-arm64 }
          - { name: macOS Intel, runner: macos-15-intel, platform: darwin/amd64, artifact: macos-intel }
          - { name: macOS Apple Silicon, runner: macos-15, platform: darwin/arm64, artifact: macos-arm64 }
          - { name: Linux x64, runner: ubuntu-24.04, platform: linux/amd64, artifact: linux-x64 }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, platform: linux/arm64, artifact: linux-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        if: runner.os != 'Windows' || runner.arch == 'X64'
        with:
          python-version: '3.13'
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        with:
          python-version: '3.13'
          architecture: x64
      - name: Require license and notices
        shell: bash
        run: test -f LICENSE && test -f THIRD_PARTY_NOTICES.md && test -f LICENSES/GPL-2.0-or-later.txt
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
      - name: Test Go
        run: |
          go test ./...
          go vet ./...
      - name: Build bundled esptool helper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r tools/esptool/requirements.txt
          python -m PyInstaller --noconfirm --clean --onefile --name esptool --distpath tools/esptool/dist --workpath tools/esptool/build --specpath tools/esptool tools/esptool/entry.py
      - name: Build bundled esptool helper on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/esptool/requirements.txt
          python3 -m PyInstaller --noconfirm --clean --onefile --name esptool --distpath tools/esptool/dist --workpath tools/esptool/build --specpath tools/esptool tools/esptool/entry.py
      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$(go env GOPATH)\bin;$env:Path"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          wails build -clean -trimpath -platform "${{ matrix.platform }}" -ldflags "-X main.version=$version"
          $architecture = if ('${{ matrix.platform }}' -eq 'windows/arm64') { 'arm64' } else { 'x64' }
          ./scripts/package-windows.ps1 -Version $version -Architecture $architecture
      - name: Build and package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
          version="${{ github.event_name == 'push' && github.ref_name || inputs.version }}"
          version="${version#v}"
          wails build -clean -trimpath -platform "${{ matrix.platform }}" -tags webkit2_41 -ldflags "-X main.version=$version"
          chmod +x scripts/package-unix.sh
          ./scripts/package-unix.sh "$version" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: easyinput-flasher-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Attest packaged assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: easyinput-flasher-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* --title "EasyInput Flasher ${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --title "EasyInput Flasher ${GITHUB_REF_NAME}" --generate-notes
          fi
