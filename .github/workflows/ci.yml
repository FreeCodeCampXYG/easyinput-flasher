name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - 'docs/**'
      - 'DEV_STATE.md'
      - 'flow/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }} quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, runner: windows-2025, platform: windows/amd64 }
          - { name: Windows ARM64, runner: windows-11-arm, platform: windows/arm64 }
          - { name: macOS Intel, runner: macos-15-intel, platform: darwin/amd64 }
          - { name: macOS Apple Silicon, runner: macos-15, platform: darwin/arm64 }
          - { name: Linux x64, runner: ubuntu-24.04, platform: linux/amd64 }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Check frontend
        run: npm --prefix frontend run typecheck
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Check Go formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) { $unformatted; exit 1 }
      - name: Test Go
        # HID 运行时只在原生应用构建中启用；跨平台单测关闭 CGO，避免 ARM64 runner 将 hidapi C 汇编交给错误架构的 GCC。
        env:
          CGO_ENABLED: 0
        run: go test ./...
      - name: Vet Go
        env:
          CGO_ENABLED: 0
        run: go vet ./...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0
      - name: Build native application
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          tags=""
          if [[ "${{ runner.os }}" == "Linux" ]]; then tags="-tags webkit2_41"; fi
          wails build -clean -trimpath -platform "${{ matrix.platform }}" $tags -ldflags "-X main.version=ci-${{ github.sha }}"
